<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BioCity prototype: scan your yard and find native plants that bring in pollinators.">
<title>BioCity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single phone-width column, sticky header with back, cards only where a thing is tappable */
:root{
  --bg:#edf1e8;--surface:#fafbf6;--sunken:#e2e8db;--ink:#1c2a1f;--muted:#566659;--line:#d0d9ca;
  --moss:#2e6a3a;--moss-ink:#ffffff;--moss-soft:#d8e8d6;--pollen:#c98f12;--pollen-soft:#f6e6bb;
  --invasive:#b23f2c;--invasive-soft:#f6dcd5;--nonnative:#5a5f9c;--nonnative-soft:#e1e2f2;
  --sky:#cfe3e6;--grass:#9cc58a;--grass2:#7fb06f;--water:#b7d4e0;--road:#ffffff;
  --display:"Bricolage Grotesque",ui-rounded,"Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111813;--surface:#19231b;--sunken:#0d130f;--ink:#e5ede2;--muted:#9bad9e;--line:#2b3a2e;
  --moss:#83c991;--moss-ink:#0d1a10;--moss-soft:#22382a;--pollen:#efc55a;--pollen-soft:#3a3018;
  --invasive:#f08f7b;--invasive-soft:#3e211b;--nonnative:#aeb3ec;--nonnative-soft:#272a45;
  --sky:#1f3236;--grass:#2f4d2f;--grass2:#3b5f39;--water:#23414d;--road:#2a352c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813;--surface:#19231b;--sunken:#0d130f;--ink:#e5ede2;--muted:#9bad9e;--line:#2b3a2e;
  --moss:#83c991;--moss-ink:#0d1a10;--moss-soft:#22382a;--pollen:#efc55a;--pollen-soft:#3a3018;
  --invasive:#f08f7b;--invasive-soft:#3e211b;--nonnative:#aeb3ec;--nonnative-soft:#272a45;
  --sky:#1f3236;--grass:#2f4d2f;--grass2:#3b5f39;--water:#23414d;--road:#2a352c;color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.app{min-height:100%;display:flex;flex-direction:column}
.content{flex:1;min-width:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header.bar h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
main{flex:1;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.has-tabs main{padding-bottom:24px}
h2{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;cursor:pointer;text-align:center;display:block;width:100%;text-decoration:none}
.btn.primary{background:var(--moss);color:var(--moss-ink)}
.btn.ghost{background:transparent;color:var(--moss);border:1.5px solid var(--moss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--pollen);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font:inherit;min-height:140px}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--moss-soft);color:var(--moss)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tile.feature{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.tile.feature .ic{background:color-mix(in srgb,var(--moss-ink) 18%,transparent);color:var(--moss-ink)}
.tile b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.tile span{font-size:.85rem;opacity:.85}
.row{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font:inherit;width:100%}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--sunken)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px}
.tag.native{background:var(--moss-soft);color:var(--moss)}
.tag.nonnative{background:var(--nonnative-soft);color:var(--nonnative)}
.tag.invasive{background:var(--invasive-soft);color:var(--invasive)}
.tag.pollinator{background:var(--pollen-soft);color:var(--pollen)}
.tag.example{background:var(--sunken);color:var(--muted)}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--sunken);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.input{width:100%;font:inherit;font-size:1.75rem;font-family:var(--display);letter-spacing:.2em;text-align:center;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.err{color:var(--invasive);font-size:.9rem;min-height:1.4em}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.choice input{accent-color:var(--moss);width:20px;height:20px}
.choice label:has(input:checked){border-color:var(--moss);background:var(--moss-soft)}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--moss)}
.tabs{display:flex;gap:6px;background:var(--sunken);padding:4px;border-radius:14px}
.tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.notice{border-left:4px solid var(--invasive);background:var(--invasive-soft);padding:10px 12px;border-radius:0 12px 12px 0;font-size:.9rem}
.match{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.match em{font-style:normal;color:var(--moss);font-weight:700}
.conf{font-variant-numeric:tabular-nums;font-weight:700;color:var(--moss)}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--moss-soft);border-top-color:var(--moss);animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.upload{position:relative}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.map{width:100%;max-width:100%;aspect-ratio:6/5;border-radius:18px;border:1px solid var(--line);display:block;background:var(--grass)}
.map .pin{cursor:pointer}
.map .pin path{fill:var(--moss);stroke:var(--surface);stroke-width:2}
.map .pin.sel path{fill:var(--pollen)}
.map .pin text{fill:var(--moss-ink);font:700 11px var(--body)}
.map .pin.sel text{fill:#1c2a1f}
.group{display:flex;flex-direction:column;gap:10px}
.group>h3{display:flex;justify-content:space-between;align-items:baseline}
.group>h3 small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.proto{font-size:.75rem;text-align:center;color:var(--muted);padding:0 16px 16px}
.hero-ill{width:100%;max-width:100%;border-radius:22px;display:block}
.brand{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.02em;color:var(--moss)}
/* Shared layout helpers: single column on phones, grids on wide screens */
.list{display:grid;gap:12px}
.split{display:flex;flex-direction:column;gap:20px}
.split>div{display:flex;flex-direction:column;gap:20px;min-width:0}
.side{display:none}
.side-brand{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;color:var(--moss);padding:4px 12px 20px}
.navitem{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.navitem svg{color:var(--muted);flex:none}
.navitem[aria-current="page"]{background:var(--moss-soft);color:var(--moss)}
.navitem[aria-current="page"] svg{color:var(--moss)}
.navitem:hover{background:var(--sunken)}
.navitem[aria-current="page"]:hover{background:var(--moss-soft)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px}
.tabbar{position:sticky;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .navitem{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.7rem;text-align:center;justify-content:center;border-radius:10px}
.tabbar .navitem[aria-current="page"]{background:transparent}
.tabbar .navitem svg{padding:3px 14px;box-sizing:content-box;border-radius:999px}
.tabbar .navitem[aria-current="page"] svg{background:var(--moss-soft)}
.onboard{justify-content:center}
.narrow{max-width:560px}
.item{min-width:0;display:flex;flex-direction:column}
.item>.row .chev{flex:none;color:var(--muted);transition:transform .2s}
.item.open{grid-column:1/-1;background:var(--surface);border:1.5px solid var(--moss);border-radius:18px;overflow:hidden}
.item.open>.row{border:0;border-radius:0;background:var(--moss-soft)}
.item.open>.row .chev{transform:rotate(180deg);color:var(--moss)}
.item-body{padding:16px;display:grid;gap:16px}
figure{margin:0}
figcaption{font-size:.75rem;color:var(--muted);margin-top:6px}
figcaption a{color:inherit}
.chip.static{cursor:default}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mini{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.mini img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunken)}
.mini span{display:flex;flex-direction:column;min-width:0;font-size:.85rem;line-height:1.3}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunken)}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--moss);border-radius:4px;transition:width .4s}
.placeholder{display:grid;place-items:center;color:var(--muted)}
.map.sat{aspect-ratio:18/13;background:#4f6b3a}
.map .pin.proj path{fill:var(--pollen)}
.map .pin.proj text{fill:#1c2a1f}
.map .pin.near.sel path{stroke:var(--ink);stroke-width:3}
.map .pin.near.sel:not(.proj) path{fill:var(--moss)}
.map .pin.near.sel:not(.proj) text{fill:var(--moss-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink)}
details summary{cursor:pointer;font-weight:700}
details ol{margin:8px 0 0;padding-left:22px;display:grid;gap:4px}
.field{display:flex;flex-direction:column;gap:6px}
.text{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{accent-color:var(--moss);width:20px;height:20px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--moss);font-weight:700;text-decoration:underline;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;flex:none}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--moss)}
.switch input:checked::after{transform:translateX(22px)}
.optin.first{border-color:var(--pollen);background:var(--pollen-soft)}
@media (min-width:720px){.item-body{grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:start}}
@media (min-width:960px){
  .app.chrome{flex-direction:row}
  .side{display:flex;flex-direction:column;gap:2px;width:256px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;padding:24px 12px;background:var(--surface);border-right:1px solid var(--line)}
  .tabbar,.hdr-zip,.hdr-acct,.iconbtn.top{display:none}
  .content{max-width:1180px}
  .content.narrow{max-width:680px}
  header.bar{padding:18px 40px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
  header.bar h1{font-size:1.5rem}
  main{padding:32px 40px 64px;gap:28px}
  h2{font-size:2.25rem}
  .list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .list.tight{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
  .split>.pin-top{position:sticky;top:100px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  .tile,.tile.feature,.tile.wide{grid-column:auto;flex-direction:column;align-items:flex-start;min-height:180px;padding:20px}
  .lede{max-width:62ch}
  .onboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;max-width:1080px;margin:0 auto;width:100%;min-height:100vh;padding-block:48px}
  .onboard .brand{font-size:4rem}
}
</style>
</head>

<script>
const PLANTS={

"buttonbush":{n:"Buttonbush",s:"Cephalanthus occidentalis",c:"Bush",st:"native",p:1,sun:["full","part"],w:"High",b:"Round flower heads draw swallowtails, bees and hummingbirds.",d:"Thrives in wet spots and rain gardens. 5–10 ft.",loc:"Pond and lake margins, swamps and stream banks.",sg:1,h:60,i:"0/0b/Cephalanthus_occidentalis_occidentalis1.jpg"},

"nj-tea":{n:"New Jersey tea",s:"Ceanothus americanus",c:"Small bush",st:"native",p:1,sun:["full","part"],w:"Low",b:"Clouds of white flowers draw many small native bees and butterflies.",d:"Drought-tolerant once established; deep roots. 2–3 ft.",loc:"Dry prairies, open woods and sandy or rocky slopes.",sg:1,h:90,i:"e/ee/Ceanothus_americanus1.jpg"},

  return `<svg class="map sat" viewBox="0 0 360 260" role="img" aria-label="Satellite view of your property with ${(pr.shots||[]).length} saved photo locations">

    </div></div></article>`;

function suggestions(found){
  const have=new Set(found);
  const out={};
  CATS.forEach(c=>{
    const list=Object.entries(PLANTS).filter(([id,p])=>p.sg&&p.c===c&&p.st!=="invasive"&&!have.has(id))
      .sort((a,b)=>(a[1].st==="native"?0:1)-(b[1].st==="native"?0:1)||b[1].p-a[1].p).slice(0,3);
    if(list.length)out[c]=list.map(x=>x[0]);
  });
  return out;
}

      <div class="legend"><span><i style="background:#ffd640"></i>Yard photos</span><span><i style="background:#fff"></i>Close-ups</span><span><i style="background:transparent;border:2px dashed #c9a400;border-radius:3px"></i>Property line</span></div>
      <p class="small muted">${isGuest?"Sign up to keep these. ":""}BioCity saves where and when each photo was taken, so a light-level app can reuse these pictures instead of you retaking them.</p>
      <details class="small"><summary>${pr.shots.length} saved locations</summary><ol>${pr.shots.map(s=>`<li>${esc(s.label)} <span class="muted">· ${s.lat}, ${s.lng} · ${fmtTime(s.t)}</span></li>`).join("")}</ol></details>
      ${isGuest?"":`<a class="btn ghost" download="biocity-${pr.id}-photos.geojson" href="${geojson(pr)}">Export locations for a light app</a>`}
    </section>
    </div>
    <div>
    ${CATS.filter(c=>sug[c]).map(c=>`<section class="group"><h3>${c}<small>${sug[c].length}</small></h3><div class="list tight">${sug[c].map(i=>plantItem(i,`<p class="small" style="margin:4px 0">${esc(PLANTS[i].b)}</p>`)).join("")}</div></section>`).join("")}
    <section class="group"><h3>Already in your yard<small>${pr.found.length}</small></h3><div class="list tight">${pr.found.map(i=>plantItem(i)).join("")}</div></section>
    <button class="btn ghost" data-act="go" data-v="shops">Find these at local shops</button>
    </div>
  </div></main>`;
};

V.shops=()=>{
  const sel=SHOPS.find(s=>s.id===selShop);
  return `${header("Shops near "+zip)}<main><div class="split">
  <div class="pin-top">${baseMap("Map of plant shops near you",SHOPS.map((s,i)=>pinSVG(s,i,"shop",s.id===selShop)).join(""),YOU_DOT)}</div>
  <div>
  ${sel?`<div class="card"><h3>${esc(sel.n)}</h3><p class="muted small">${sel.mi} · ${sel.h}</p><p class="small">${esc(sel.t)}</p><a class="btn primary" href="https://example.com/" target="_blank" rel="noopener">Visit website</a><p class="muted small">Prototype: this opens a placeholder site.</p></div>`:`<p class="muted small">Tap a pin or a shop to see details. The yellow dot is you.</p>`}
  <div class="stack">${SHOPS.map((s,i)=>`<button class="row" data-act="shop" data-id="${s.id}"><span class="ic" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:${s.id===selShop?"var(--pollen)":"var(--moss)"};color:${s.id===selShop?"#1c2a1f":"var(--moss-ink)"};font-weight:700;flex:none">${i+1}</span><div class="txt"><b>${esc(s.n)}</b><span class="muted small">${s.mi} · ${esc(s.t)}</span></div></button>`).join("")}</div>
  </div>
  </div></main>`;
};

V.nearby=()=>{
  const u=user();if(!u)return V.account();
  const first=u.optIn==null,on=!!u.optIn;
  const list=NEARBY.filter(x=>nearFilter==="all"||x.k===nearFilter);
  const sel=list.find(x=>x.id===selNear);
  const you=on?`<g transform="translate(180 150)"><circle r="12" fill="var(--pollen)" stroke="var(--surface)" stroke-width="3"/><text y="3.5" text-anchor="middle" style="font:700 9px var(--body);fill:#1c2a1f">You</text></g>`:`<circle cx="180" cy="150" r="9" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 3"/>`;
  const badge=(x,i)=>`<span class="ic" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:${x.k==="proj"?"var(--pollen)":"var(--moss)"};color:${x.k==="proj"?"#1c2a1f":"var(--moss-ink)"};font-weight:700;flex:none${x.id===selNear?";outline:3px solid var(--ink);outline-offset:1px":""}">${i+1}</span>`;
  return `${header("Yards near me")}<main><div class="split">
  <div class="pin-top">${baseMap("Map of BioCity yards and projects near you",list.map((x,i)=>pinSVG(x,i,"near",x.id===selNear,"near"+(x.k==="proj"?" proj":""))).join(""),you)}
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--moss)"></i>Yards</span><span><i style="background:var(--pollen)"></i>Projects</span><span><i style="background:${on?"var(--pollen)":"transparent"};border-style:${on?"solid":"dashed"}"></i>You${on?"":" (hidden)"}</span></div>
  </div>
  <div>
    <div class="card optin${first?" first":""}">
      ${first?`<span class="eyebrow">New</span><h3>Share your yard with neighbors?</h3>`:""}
      <div style="display:flex;gap:16px;align-items:center;justify-content:space-between">
        <p class="small">${on?"Your yard is on the map. Nearby BioCity members can see its pin and what you're growing.":"Your yard is hidden. You can still see everyone who has opted in."}</p>
        <label class="switch">Opt in<input type="checkbox" role="switch" data-toggle="optin"${on?" checked":""}></label>
      </div>
      <p class="small muted">It's optional and you can change it any time. Pins show your general area, never your address.</p>
    </div>
    <div class="tabs" role="tablist">${[["all","All"],["yard","Yards"],["proj","Projects"]].map(([k,l])=>`<button role="tab" aria-selected="${nearFilter===k}" data-act="nfilter" data-f="${k}">${l}</button>`).join("")}</div>
    ${sel?`<div class="card"><span class="eyebrow">${sel.k==="proj"?"Community project":"BioCity yard"} · ${sel.mi}</span><h3>${esc(sel.n)}</h3>${sel.by?`<p class="small muted">Organized by ${esc(sel.by)}</p>`:""}<p class="small">${esc(sel.d)}</p><span class="eyebrow">Growing here</span><div class="minis">${sel.pl.map(mini).join("")}</div></div>`:`<p class="muted small">Tap a pin or a row to see a yard or project. Only people who opted in are shown.</p>`}
    <div class="stack">${list.map((x,i)=>`<button class="row" data-act="near" data-id="${x.id}">${badge(x,i)}<div class="txt"><b>${esc(x.n)}</b><span class="muted small">${x.mi} · ${x.k==="proj"?"Project":"Yard"}</span></div></button>`).join("")}</div>
  </div>
  </div></main>`;
};

V.plants=()=>{
  const list=Object.entries(PLANTS).filter(([,p])=>p.st===libTab).sort((a,b)=>CATS.indexOf(a[1].c)-CATS.indexOf(b[1].c));
  return `${header("Plant Library")}<main>
  <p class="muted">Common plants in the ${esc(region())}. Tap one to see more.</p>
  <div class="tabs" role="tablist" style="max-width:420px"><button role="tab" aria-selected="${libTab==="native"}" data-act="tab" data-t="native">Native</button><button role="tab" aria-selected="${libTab==="invasive"}" data-act="tab" data-t="invasive">Invasive</button></div>
  <div class="list">${list.map(([id])=>plantItem(id)).join("")}</div></main>`;
};

V.pollinators=()=>`${header("Pollinator Library")}<main>
  <p class="muted">Pollinators found in the ${esc(region())}, the plants that help them and the ones that harm them.</p>
  <div class="list">${Object.keys(POLL).map(pollItem).join("")}</div></main>`;

const app=document.getElementById("app");
function render(top){
  const c=cur(),ch=chrome();
  app.className="app"+(ch?" chrome has-tabs":"");
  app.innerHTML=(ch?sidebar():"")+`<div class="content${["scan","zip","account"].includes(c.v)?" narrow":""}">${V[c.v](c)}<p class="proto">Prototype · sample data, no real plant identification · plant and pollinator photos from Wikimedia Commons</p>${ch?`<nav class="tabbar" aria-label="Main">${navItems(true)}</nav>`:""}</div>`;
  if(top)window.scrollTo(0,0);
  const z=document.getElementById("zip");if(z&&!zip)z.focus();
  if(focusK){const b=app.querySelector(`[data-k="${focusK}"]`);if(b){b.focus({preventScroll:true});if(b.parentElement.classList.contains("open"))b.parentElement.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}focusK=null}
}

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function startAnalyze(){
  scan.step="analyzing";render(true);
  setTimeout(()=>{
    scan.found=[pick(YARD_POOL.Tree),pick(YARD_POOL.Bush),pick(YARD_POOL["Small plant"])];
    scan.i=0;scan.cu={photos:[]};scan.step="closeup";render(true);
  },1800);
}
function addYard(urls){urls.forEach(u=>{scan.photos.push(u);scan.shots.push(newShot("yard","Yard photo "+scan.photos.length))});render()}
function identify(urls){
  const c=scan.cu,p=PLANTS[scan.found[scan.i]];
  urls.forEach(u=>{c.photos.push(u);scan.shots.push(newShot("closeup",`${p.n} close-up ${c.photos.length}`))});
  c.busy=true;render();
  clearTimeout(idTimer);idTimer=setTimeout(()=>{c.busy=false;c.conf=Math.min(99,62+c.photos.length*9+Math.floor(Math.random()*5));render()},1200);
}
function finish(){
  const u=user();
  const pr={id:"p"+Date.now(),name:"",date:Date.now(),photo:scan.photos[0],seed:scan.seed,found:scan.found,shots:scan.shots};
  scan=null;openKey=null;
  if(u){pr.name="Yard scan "+(u.projects.filter(p=>!p.example).length+1);u.projects.unshift(pr);save();stack=[{v:"home"},{v:"yard"},{v:"project",id:pr.id}]}
  else{pr.name="Your yard scan";guest=pr;stack=[{v:"home"},{v:"project",id:"guest"}]}
  render(true);
}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

const ACT={
  back,
  next:()=>{D.seen=true;save();go("zip")},
  welcomeacct:()=>{D.seen=true;save();acctErr="";go("account")},
  account:()=>{acctErr="";acctDraft={};go("account")},
  signout:()=>{D.me="";save();guest=null;reset(zip?"home":"zip")},
  changezip:()=>{zipErr="";go("zip")},
  go:el=>go(el.dataset.v),
  nav:el=>{const v=el.dataset.v;openKey=null;if(v==="scan"){stack=[{v:"home"}];ACT.newscan();return}stack=v==="home"?[{v:"home"}]:[{v:"home"},{v}];render(true)},
  newscan:()=>{scan={step:"photo",photos:[],shots:[],seed:1+Math.floor(Math.random()*9)};go("scan")},
  sampleyard:()=>addYard([pic(YARD_PIC,960)]),
  analyze:startAnalyze,
  samplecu:()=>identify([pic(PLANTS[scan.found[scan.i]].i,500)]),
  nextcu:()=>{if(scan.i<scan.found.length-1){scan.i++;scan.cu={photos:[]};render(true)}else finish()},
  project:el=>go("project",{id:el.dataset.id}),
  toggle:el=>{const k=el.dataset.k;openKey=openKey===k?null:k;focusK=k;render()},
  shop:el=>{selShop=el.dataset.id;render()},
  near:el=>{selNear=el.dataset.id;render()},
  nfilter:el=>{nearFilter=el.dataset.f;render()},
  tab:el=>{libTab=el.dataset.t;openKey=null;render()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("g[data-act]")){e.preventDefault();ACT[e.target.dataset.act](e.target)}});
document.addEventListener("error",e=>{const t=e.target;if(t.tagName!=="IMG")return;if(t.dataset.h){t.src=leafSVG(+t.dataset.h);delete t.dataset.h}else if(t.dataset.y){t.src=yardSVG(+t.dataset.y);delete t.dataset.y}},true);
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches("[data-upload]")&&t.files.length){
    const urls=[];for(const f of t.files){try{urls.push(await shrink(f))}catch(err){}}
    if(!urls.length)return;
    if(t.dataset.upload==="yard")addYard(urls);else identify(urls);
  }
  if(t.dataset.toggle==="optin"){const u=user();if(u){u.optIn=t.checked;save();render();app.querySelector('[data-toggle="optin"]')?.focus()}}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.dataset.form,el=e.target.elements;
  if(f==="zip"){
    const v=el.zip.value.trim();
    if(!/^\d{5}$/.test(v)){zipErr="Enter a 5-digit zip code, like 02139.";render();return}
    zipErr="";zip=v;
    const u=user();if(u){u.zip=el.keep.checked?v:"";save()}
    reset("home");
  }
  if(f==="account"){
    const em=el.email.value.trim().toLowerCase(),z=el.zip.value.trim();
    acctDraft={email:em,zip:z};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){acctErr="Enter a valid email address.";render();return}
    if(z&&!/^\d{5}$/.test(z)){acctErr="A zip code is 5 digits. Or leave it blank.";render();return}
    acctErr="";acctDraft={};
    const u=D.users[em]||(D.users[em]={email:em,zip:"",projects:[exampleProject()],optIn:null});
    if(z)u.zip=z;
    D.me=em;D.seen=true;
    if(u.zip)zip=u.zip;
    let dest=[{v:"home"}];
    if(guest){const pr={...guest,id:"p"+Date.now(),name:"Yard scan "+(u.projects.filter(p=>!p.example).length+1)};u.projects.unshift(pr);guest=null;dest=[{v:"home"},{v:"yard"},{v:"project",id:pr.id}]}
    save();openKey=null;
    stack=zip?dest:[{v:"zip"}];render(true);
  }
});
render();
</script>

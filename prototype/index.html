<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BioCity prototype: scan your yard and find native plants that bring in pollinators.">
<title>BioCity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Soft green garden look: Fredoka + Nunito, chunky offset shadows, pastel tiles, a plant-pot mascot and floating emojis */
:root{
  --bg:#F2F9EA;--surface:#FFFFFF;--sunken:#E2EFD4;--ink:#1B3A2D;--muted:#476355;--line:#D3E7C6;
  --leaf:#1F7D45;--leaf-ink:#17623A;--on-leaf:#FFFFFF;--leaf2:#6CCB7A;--pollen:#FFC933;--pot:#FF9DB8;
  --tint-leaf:#BDEBC6;--tint-pollen:#FFE48F;--tint-sky:#BCE2F8;--tint-petal:#FFCADD;--tint-lav:#E1DDFB;--tint-peach:#FFD6B8;
  --lav-ink:#4B459A;--amber-ink:#6F4800;--warn:#B0391F;--tint-warn:#FFD9CF;--focus:#1F7D45;
  --grass:#B8E6A3;--grass2:#9FD68B;--water:#A8D7F2;--road:#FFFFFF;
  --blob1:rgba(255,201,51,.30);--blob2:rgba(120,200,240,.32);--blob3:rgba(255,157,184,.24);
  --shadow:rgba(27,58,45,.16);--float-op:.4;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1E19;--surface:#183029;--sunken:#0C1814;--ink:#EAF5EC;--muted:#A9C4B5;--line:#2A4A3E;
  --leaf:#6FD498;--leaf-ink:#8FE3AE;--on-leaf:#07180F;--leaf2:#3FA56A;--pollen:#FFD25A;--pot:#E27A9A;
  --tint-leaf:#1F5A3A;--tint-pollen:#5E4C12;--tint-sky:#1D4B65;--tint-petal:#5C2B43;--tint-lav:#34305A;--tint-peach:#5A3520;
  --lav-ink:#BDBFF7;--amber-ink:#FFD98A;--warn:#FF9C85;--tint-warn:#4A2118;--focus:#8FE3AE;
  --grass:#25503A;--grass2:#1F4631;--water:#1D4B65;--road:#34493F;
  --blob1:rgba(255,210,90,.10);--blob2:rgba(90,170,220,.14);--blob3:rgba(226,122,154,.10);
  --shadow:rgba(0,0,0,.45);--float-op:.28;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1E19;--surface:#183029;--sunken:#0C1814;--ink:#EAF5EC;--muted:#A9C4B5;--line:#2A4A3E;
  --leaf:#6FD498;--leaf-ink:#8FE3AE;--on-leaf:#07180F;--leaf2:#3FA56A;--pollen:#FFD25A;--pot:#E27A9A;
  --tint-leaf:#1F5A3A;--tint-pollen:#5E4C12;--tint-sky:#1D4B65;--tint-petal:#5C2B43;--tint-lav:#34305A;--tint-peach:#5A3520;
  --lav-ink:#BDBFF7;--amber-ink:#FFD98A;--warn:#FF9C85;--tint-warn:#4A2118;--focus:#8FE3AE;
  --grass:#25503A;--grass2:#1F4631;--water:#1D4B65;--road:#34493F;
  --blob1:rgba(255,210,90,.10);--blob2:rgba(90,170,220,.14);--blob3:rgba(226,122,154,.10);
  --shadow:rgba(0,0,0,.45);--float-op:.28;color-scheme:dark}
:root{
  --green:var(--tint-leaf);--yellow:var(--tint-pollen);--orange:var(--tint-peach);--teal:var(--tint-sky);--purple:var(--tint-lav);
  --green-soft:var(--surface);--yellow-soft:var(--surface);--orange-soft:var(--surface);--teal-soft:var(--surface);--purple-soft:var(--surface);
  --on-c:var(--ink);--on-primary:var(--on-leaf);--primary:var(--leaf);
  --c:var(--leaf);--c-on:var(--on-leaf);--c-soft:var(--tint-leaf);--c-deep:var(--leaf-ink);
}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.5;
  background:radial-gradient(circle at 100% -4%,var(--blob2) 0,transparent 42%),radial-gradient(circle at -6% 38%,var(--blob1) 0,transparent 36%),radial-gradient(circle at 106% 82%,var(--blob3) 0,transparent 40%),var(--bg);background-attachment:fixed}
h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:2rem}
h3{font-size:1.3rem}
p{margin:0}
a{color:var(--leaf-ink);font-weight:700;text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:.95rem}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{max-width:56ch;font-size:1.15rem}
.stack{display:flex;flex-direction:column;gap:12px}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:12px}

.floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);line-height:1;opacity:var(--float-op);user-select:none;animation:floaty var(--t) ease-in-out var(--d) infinite}
@keyframes floaty{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(10px,-24px) rotate(6deg)}}

.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.content{flex:1;min-width:0;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;padding:0 16px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0}
.bar-in{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 8px;box-shadow:0 4px 0 var(--shadow);min-width:0}
.bar-in h1{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;flex:1;min-width:0;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:0;width:46px;height:46px;border-radius:50%;background:var(--tint-leaf);color:var(--leaf-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.float{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:6;box-shadow:0 4px 0 var(--shadow)}
.chip{appearance:none;font:inherit;font-weight:800;font-size:.9rem;border:0;border-radius:999px;background:var(--tint-sky);color:var(--ink);padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.chip.static{cursor:default;background:var(--sunken)}
main{flex:1;padding:14px 0 calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;min-width:0}
.has-tabs main{padding-bottom:16px}

.btn{appearance:none;font:inherit;font-family:var(--display);font-weight:600;font-size:1.15rem;min-height:56px;padding:12px 26px;border-radius:999px;border:3px solid var(--leaf);background:var(--surface);color:var(--leaf-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;text-align:center;box-shadow:0 4px 0 var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{background:var(--tint-leaf)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:var(--leaf);color:var(--on-leaf)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--tint-sky)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload:focus-within{outline:4px solid var(--focus);outline-offset:3px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:0;border-radius:32px;padding:20px 20px 70px;min-height:200px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;position:relative;box-shadow:0 6px 0 var(--shadow);transition:transform .15s ease;min-width:0;background:var(--tint-leaf)}
.tile:nth-child(5n+2){background:var(--tint-pollen)}
.tile:nth-child(5n+3){background:var(--tint-sky)}
.tile:nth-child(5n+4){background:var(--tint-petal)}
.tile:nth-child(5n+5){background:var(--tint-lav)}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:translateY(2px)}
.tile::after{content:"\2192";position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--leaf-ink);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.tile .ic{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin-bottom:auto;color:var(--leaf-ink);flex:none}
.tile .ic svg{width:32px;height:32px}
.tile b{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.1}
.tile span{font-size:.98rem;line-height:1.3}
.tile.feature,.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:0;padding:20px 76px 20px 20px}
.tile.feature::after,.tile.wide::after{top:50%;bottom:auto;transform:translateY(-50%)}
.tile.feature .ic,.tile.wide .ic{margin-bottom:0}

.list{display:grid;gap:14px}
.group{display:flex;flex-direction:column;gap:12px}
.group>h3{display:flex;justify-content:space-between;align-items:baseline}
.group>h3 small{font-family:var(--body);font-weight:700;font-size:.9rem;color:var(--muted)}
.row{appearance:none;font:inherit;color:var(--ink);text-align:left;width:100%;border:0;background:var(--surface);border-radius:28px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;box-shadow:0 4px 0 var(--line);min-width:0}
.row:hover{background:color-mix(in srgb,var(--tint-sky) 40%,var(--surface))}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .txt b{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.15}
.thumb{width:68px;height:68px;border-radius:22px;object-fit:cover;flex:none;background:var(--sunken)}
.card{background:var(--surface);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--line);min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 12px;background:var(--sunken);color:var(--muted)}
.tag.native{background:var(--tint-leaf);color:var(--leaf-ink)}
.tag.nonnative{background:var(--tint-lav);color:var(--lav-ink)}
.tag.invasive{background:var(--tint-warn);color:var(--warn)}
.tag.pollinator{background:var(--tint-pollen);color:var(--amber-ink)}
.tag.example{background:var(--sunken);color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem;margin:0}
.facts dt{color:var(--muted);font-weight:700}
.facts dd{margin:0}
.notice{background:var(--tint-warn);border-radius:24px;padding:14px 18px;font-size:.98rem}
.match{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);font-weight:700}
.match em{font-style:normal;color:var(--leaf-ink)}
.conf{font-weight:800;color:var(--leaf-ink);font-variant-numeric:tabular-nums}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:32px;background:var(--sunken);display:block;box-shadow:0 5px 0 var(--shadow)}
.placeholder{display:grid;place-items:center;color:var(--muted)}

.input{width:100%;font:inherit;font-family:var(--display);font-weight:600;font-size:2.6rem;letter-spacing:.16em;text-align:center;padding:10px 14px;border-radius:24px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.input:focus,.text:focus{border-color:var(--leaf);outline:none}
.err{color:var(--warn);font-weight:800;min-height:1.4em}
fieldset{border:0;padding:0;margin:0;min-width:0}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:14px;align-items:center;padding:14px 18px;border:3px solid transparent;border-radius:26px;background:var(--surface);cursor:pointer;font-weight:700;box-shadow:0 4px 0 var(--line)}
.choice input{accent-color:var(--leaf);width:22px;height:22px;flex:none}
.choice label:has(input:checked){border-color:var(--leaf);background:var(--tint-leaf)}
.qcard{background:var(--c);color:var(--ink);border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--shadow)}
.qcard .eyebrow{color:var(--ink)}
.qcard .choice label{color:var(--ink);box-shadow:0 4px 0 var(--shadow)}
.qcard .choice label:has(input:checked){border-color:var(--leaf);background:var(--surface)}
.progress{display:flex;gap:8px}
.progress i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.progress i.on{background:var(--leaf)}
.tabs{display:flex;gap:6px;background:var(--sunken);padding:6px;border-radius:999px;max-width:440px}
.tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-family:var(--display);font-weight:600;font-size:1.1rem;padding:10px;min-height:48px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
.spinner{display:flex;justify-content:center;gap:8px;margin:24px auto}
.spinner i{width:18px;height:18px;border-radius:50%;background:var(--leaf);animation:bob 1s infinite ease-in-out}
.spinner i:nth-child(2){animation-delay:.15s;background:var(--pollen)}
.spinner i:nth-child(3){animation-delay:.3s;background:var(--pot)}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-8px);opacity:1}}

.map{width:100%;max-width:100%;aspect-ratio:6/5;border-radius:32px;display:block;background:var(--grass);box-shadow:0 5px 0 var(--shadow)}
.map .pin{cursor:pointer}
.map .pin path{fill:var(--leaf);stroke:var(--surface);stroke-width:2.5}
.map .pin.sel path{fill:var(--pollen)}
.map .pin text{fill:var(--on-leaf);font:800 12px var(--body)}
.map .pin.sel text{fill:#1B3A2D}
.map.sat{aspect-ratio:18/13;background:#4f6b3a}
.map .pin.proj path{fill:var(--pollen)}
.map .pin.proj text{fill:#1B3A2D}
.map .pin.near.sel path{stroke:var(--ink);stroke-width:3}
.map .pin.near.sel:not(.proj) path{fill:var(--leaf)}
.map .pin.near.sel:not(.proj) text{fill:var(--on-leaf)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink)}

.proto{font-size:.85rem;text-align:center;color:var(--muted);padding:0 8px 18px}
.buddy{width:190px;height:auto;max-width:100%;align-self:center}
.buddy.sm{width:110px}
.buddy .shadow{fill:var(--shadow)}.buddy .pot{fill:var(--pot)}.buddy .rim{fill:var(--pot);stroke:var(--surface);stroke-width:3}
.buddy .stemline{stroke:var(--leaf);fill:none}.buddy .lf1{fill:var(--leaf2)}.buddy .lf2{fill:var(--leaf)}
.buddy .eye{fill:#1B3A2D}.buddy .smile{stroke:#1B3A2D;fill:none;stroke-width:3.5;stroke-linecap:round}.buddy .cheek{fill:#fff;opacity:.55}
.brand{font-family:var(--display);font-weight:600;font-size:3.2rem;line-height:1;color:var(--leaf-ink)}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 3px 0 var(--shadow))}
.logo .lg-bg{fill:var(--tint-sky)}.logo .lg-sun{fill:var(--pollen)}.logo .lg-bld{fill:var(--muted);opacity:.35}.logo .lg-ground{fill:var(--leaf2)}
.logo .lg-leaf1{fill:var(--leaf)}.logo .lg-leaf2{fill:var(--leaf2)}.logo .lg-stem{stroke:var(--leaf);stroke-width:4;stroke-linecap:round;fill:none}
.logo .lg-wing{fill:var(--surface);stroke:var(--leaf);stroke-width:1}.logo .lg-bee{fill:var(--pollen);stroke:#1B3A2D;stroke-width:1.2}.logo .lg-stripe{stroke:#1B3A2D;stroke-width:1.8;fill:none}.logo .lg-ring{fill:none;stroke:var(--leaf);stroke-width:3}

.split{display:flex;flex-direction:column;gap:22px}
.split>div{display:flex;flex-direction:column;gap:22px;min-width:0}
.side{display:none}
.side-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.7rem;color:var(--leaf-ink);padding:4px 8px 18px}
.navitem{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-family:var(--display);font-weight:500;font-size:1.1rem;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:999px;cursor:pointer;text-align:left;width:100%}
.navitem svg{color:var(--muted);flex:none}
.navitem:hover{background:var(--sunken)}
.navitem[aria-current="page"]{background:var(--tint-leaf);color:var(--leaf-ink);font-weight:600}
.navitem[aria-current="page"] svg{color:var(--leaf-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 8px 4px}
.tabbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;background:var(--surface);border-radius:32px;padding:6px;box-shadow:0 5px 0 var(--shadow);margin-bottom:8px}
.tabbar .navitem{flex:1;min-width:0;flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:700;text-align:center;justify-content:center;border-radius:24px}
.tabbar .navitem span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onboard{justify-content:center;gap:24px}
.narrow{max-width:600px}

.item{min-width:0;display:flex;flex-direction:column}
.item>.row .chev{flex:none;color:var(--muted);transition:transform .2s}
.item.open{grid-column:1/-1;background:var(--surface);border-radius:28px;overflow:hidden;box-shadow:0 5px 0 var(--shadow)}
.item.open>.row{border-radius:0;box-shadow:none;background:var(--tint-leaf)}
.item.open>.row .chev{transform:rotate(180deg);color:var(--leaf-ink)}
.item-body{padding:16px;display:grid;gap:16px}
figure{margin:0}
figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
figcaption a{color:inherit;font-weight:400}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mini{display:flex;gap:10px;align-items:center;padding:6px;border-radius:18px;background:var(--bg);min-width:0}
.mini img{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:var(--sunken)}
.mini span{display:flex;flex-direction:column;min-width:0;font-size:.88rem;line-height:1.3}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip img{width:64px;height:64px;border-radius:18px;object-fit:cover;flex:none;background:var(--sunken)}
.meter{height:12px;border-radius:6px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:6px;transition:width .4s}
details summary{cursor:pointer;font-weight:700}
details ol{margin:8px 0 0;padding-left:22px;display:grid;gap:4px}
.field{display:flex;flex-direction:column;gap:6px}
.text{width:100%;font:inherit;padding:12px 16px;border-radius:20px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{accent-color:var(--leaf);width:20px;height:20px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--leaf-ink);font-weight:700;text-decoration:underline;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;flex:none}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--leaf)}
.switch input:checked::after{transform:translateX(22px)}
.optin.first{background:var(--tint-pollen)}
@media (prefers-reduced-motion:reduce){.floaters span,.spinner i{animation:none}.btn,.tile{transition:none}.tile:hover{transform:none}}
@media (min-width:720px){.item-body{grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:start}}
@media (min-width:960px){
  .app.chrome{flex-direction:row;gap:28px;padding:16px;align-items:flex-start}
  .side{display:flex;flex-direction:column;gap:4px;width:264px;flex:none;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px - env(safe-area-inset-top,0px));padding:22px 14px 14px;background:var(--surface);border-radius:32px;box-shadow:0 5px 0 var(--shadow);overflow-y:auto}

function leafSVG(h){

}

const LOTS=[[0,90],[90,215],[215,300],[300,360]];
const BASE=[42.3736,-71.1097];
function latlng(x,y){return [+(BASE[0]-(y-100)*1.9e-6).toFixed(6),+(BASE[1]+(x-150)*2.6e-6).toFixed(6)]}
function newShot(kind,label,x=104+Math.random()*98,y=30+Math.random()*90,t=Date.now()){x=Math.round(x);y=Math.round(y);const [lat,lng]=latlng(x,y);return {kind,label,x,y,lat,lng,t}}
function satMap(pr){
  const r=n=>((Math.sin((pr.seed||3)*99+n*7.13)+1)/2);
  const roofs=["#7d6f63","#8a8f94","#6e5a4c","#9a8a78"];
  const patches=Array.from({length:36},(_,k)=>`<circle cx="${r(k)*360}" cy="${r(k+50)*184}" r="${6+r(k+100)*16}" fill="${k%3?"#46622f":"#5f7d45"}" opacity=".7"/>`).join("");
  const houses=LOTS.map(([a,b],k)=>{const w=b-a-30;return `<rect x="${b-20}" y="136" width="14" height="48" fill="#a3a197"/><rect x="${a+8}" y="128" width="${w}" height="38" rx="2" fill="${roofs[k%4]}"/><path d="M${a+8} 147 H${a+8+w}" stroke="rgba(0,0,0,.25)"/>`}).join("")
    +[[0,70],[70,180],[180,280],[280,360]].map(([a,b],k)=>`<rect x="${a+10}" y="230" width="${b-a-24}" height="34" rx="2" fill="${roofs[(k+2)%4]}"/>`).join("");
  const trees=Array.from({length:24},(_,k)=>{const x=r(k+7)*360,y=r(k+40)*112+6,rad=7+r(k+80)*12;return `<circle cx="${x}" cy="${y}" r="${rad}" fill="#2f4a26"/><circle cx="${x-rad*.25}" cy="${y-rad*.25}" r="${rad*.6}" fill="#3f6332"/>`}).join("");
  const shots=(pr.shots||[]).map((s,k)=>`<g transform="translate(${s.x} ${s.y})"><title>${esc(s.label)} · ${s.lat}, ${s.lng}</title><circle r="8" fill="${s.kind==="yard"?"#ffd640":"#ffffff"}" stroke="#1c2a1f" stroke-width="1.5"/><text y="3.2" text-anchor="middle" style="font:700 9px var(--body);fill:#1c2a1f">${k+1}</text></g>`).join("");
  return `<svg class="map sat" viewBox="0 0 360 260" role="img" aria-label="Satellite view of your property with ${(pr.shots||[]).length} saved photo locations">
    <rect width="360" height="260" fill="#4f6b3a"/>${patches}
    <rect y="184" width="360" height="38" fill="#a9a79d"/><rect y="190" width="360" height="26" fill="#5c5f5a"/><path d="M0 203 H360" stroke="#d8c46a" stroke-width="1.5" stroke-dasharray="10 8"/>
    ${houses}${trees}
    <g stroke="rgba(255,255,255,.55)" stroke-width="1" fill="none">${[90,215,300].map(x=>`<path d="M${x} 0 V184"/>`).join("")}<path d="M0 184 H360"/><path d="M0 222 H360"/>${[70,180,280].map(x=>`<path d="M${x} 222 V260"/>`).join("")}</g>
    <rect x="90" y="2" width="125" height="182" fill="rgba(255,214,64,.12)" stroke="#ffd640" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="96" y="16" style="font:700 10px var(--body);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px">Your property</text>
    ${shots}</svg>`;
}
function geojson(pr){return "data:application/geo+json;charset=utf-8,"+encodeURIComponent(JSON.stringify({type:"FeatureCollection",features:pr.shots.map(s=>({type:"Feature",geometry:{type:"Point",coordinates:[s.lng,s.lat]},properties:{label:s.label,kind:s.kind,taken:new Date(s.t).toISOString()}}))}))}

const QUIZ={
  light:[["full","Full sun","6 or more hours a day"],["part","Part sun","3 to 6 hours a day"],["shade","Mostly shade","Less than 3 hours a day"],["any","Not sure","Show plants for any light"]],
  types:[["tree","Large trees","Tall shade trees, over 40 ft",["Tree"]],["smalltree","Small trees","Up to about 30 ft",["Small tree"]],["shrub","Large shrubs","Usually over 5 ft",["Bush"]],["smallshrub","Small shrubs","Usually under 5 ft",["Small bush"]],["flower","Flowers","Native wildflowers and bloomers",["Flower"]],["smallplant","Small plants","Ferns, grasses and sedges",["Small plant"]]],
  pollinators:[["bee","Bees","Bumble, mason and sweat bees",/\bbees?\b/i,"Bee"],["butterfly","Butterflies","Monarchs, swallowtails and more",/butterfl|monarch|swallowtail/i,"Butterfly"],["hummingbird","Hummingbirds","Ruby-throated hummingbirds",/hummingbird/i,"Bird"],["moth","Moths","Including day-flying clearwings",/\bmoths?\b/i,"Moth"]],
  animals:[["songbird","Songbirds","Berries, seeds and nesting cover",/\bbirds?\b|goldfinch|songbird/i],["mammal","Squirrels and chipmunks","Acorns, nuts and berries",null,["white-oak","red-maple","serviceberry","dogwood","blueberry"]],["toad","Toads and frogs","Low, shady cover to shelter in",null,["christmas-fern","pa-sedge","foamflower","wild-geranium"]]],
  time:[["low","A little","About an hour a month"],["some","Some","A few hours a month"],["lots","A lot","An hour or more a week"]]
};
const QSTEPS=[
  {id:"light",type:"radio",c:"yellow",on:"on-c",t:"How much sun does your yard get?"},
  {id:"types",type:"checkbox",c:"green",on:"on-c",t:"What would you like to plant?",h:"Pick as many as you like, or none to see everything."},
  {id:"pollinators",type:"checkbox",c:"orange",on:"on-c",t:"Which pollinators do you want to attract?",h:"Pick as many as you like, or none to skip."},
  {id:"animals",type:"checkbox",c:"teal",on:"on-c",t:"Which animals do you want to attract?",h:"Pick as many as you like, or none to skip."},
  {id:"time",type:"radio",c:"purple",on:"on-primary",t:"How much time will you spend on your garden?"}
];
function quizLabel(k,v){const o=QUIZ[k].find(x=>x[0]===v);return o?o[1]:""}
function fitsTime(p,t){return t==="low"?p.w==="Low"||p.w==="Medium":t==="some"?p.w!=="High":true}
function fitsWants(id,q){
  const pol=q.pollinators||[],ani=q.animals||[],p=PLANTS[id];
  if(!pol.length&&!ani.length)return true;
  return QUIZ.pollinators.some(([v,,,re,k])=>pol.includes(v)&&(re.test(p.b)||Object.values(POLL).some(x=>x.k===k&&x.pl.includes(id))))
    ||QUIZ.animals.some(([v,,,re,ids])=>ani.includes(v)&&(re?re.test(p.b):ids.includes(id)));
}
function suggestions(found,q){
  const have=new Set(found),any=()=>true;
  const light=q&&q.light!=="any"&&q.light?p=>p.sun.includes(q.light):any;
  const picked=q?QUIZ.types.filter(t=>(q.types||[]).includes(t[0])).flatMap(t=>t[3]):[];
  const cats=picked.length?picked:CATS;
  const time=q?p=>fitsTime(p,q.time):any,wants=q?(p,id)=>fitsWants(id,q):any;
  const passes=[[light,cats,time,wants],[light,cats,any,wants],[light,cats,any,any],[light,CATS,any,any],[any,CATS,any,any]];
  for(let i=0;i<passes.length;i++){
    const [okLight,okCats,okTime,okWants]=passes[i],groups={};
    CATS.filter(c=>okCats.includes(c)).forEach(c=>{
      const list=Object.entries(PLANTS).filter(([id,p])=>p.sg&&p.c===c&&p.st!=="invasive"&&!have.has(id)&&okLight(p)&&okTime(p)&&okWants(p,id))
        .sort((a,b)=>(q&&q.time==="low"?(a[1].w==="Low"?0:1)-(b[1].w==="Low"?0:1):0)||(a[1].st==="native"?0:1)-(b[1].st==="native"?0:1)||b[1].p-a[1].p).slice(0,3);
      if(list.length)groups[c]=list.map(x=>x[0]);
    });
    if(Object.keys(groups).length)return {groups,relaxed:i>0};
  }
  return {groups:{},relaxed:false};
}

function quizQuestion(){const i=scan.qi||0,st=QSTEPS[i],q=scan.quiz||{},v=[].concat(q[st.id]||[]);return `<form class="qcard" data-form="quiz" role="group" aria-labelledby="q-title" style="--c:var(--${st.c});--c-on:var(--${st.on});--c-soft:var(--${st.c}-soft)">

function saveQuizStep(form){const st=QSTEPS[scan.qi||0],checked=[...form.querySelectorAll(`[name="${st.id}"]:checked`)].map(x=>x.value);scan.quiz=scan.quiz||{types:[],pollinators:[],animals:[]};scan.quiz[st.id]=st.type==="radio"?checked[0]:checked}
function idCard(p,c){return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3>${esc(p.n)}</h3><span class="conf">${c.conf}% match</span></div>

V.scan=()=>{

    <div class="stack"><h2>Take pictures of your yard</h2><p class="muted">Take as many as you can: from each corner, from the house and from the back fence. The more photos, the clearer the picture BioCity gets of what's growing.</p></div>

};

const app=document.getElementById("app");
function render(top){
  const c=cur(),ch=chrome();
  app.className="app"+(ch?" chrome has-tabs":"");
  app.innerHTML=(ch?sidebar():"")+`<div class="content${["scan","zip","account"].includes(c.v)?" narrow":""}">${V[c.v](c)}<p class="proto">Prototype · sample data, no real plant identification · plant and pollinator photos from Wikimedia Commons</p>${ch?`<nav class="tabbar" aria-label="Main">${navItems(true)}</nav>`:""}</div>`;
  document.getElementById("floaters").hidden=!["welcome","zip","home","account"].includes(c.v);
  if(top)window.scrollTo(0,0);
  const z=document.getElementById("zip");if(z&&!zip)z.focus();
  if(focusK){const b=app.querySelector(`[data-k="${focusK}"]`);if(b){b.focus({preventScroll:true});if(b.parentElement.classList.contains("open"))b.parentElement.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}focusK=null}
}

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function startAnalyze(){
  scan.step="analyzing";render(true);
  setTimeout(()=>{
    if(!scan||scan.step!=="analyzing")return;
    scan.found=[pick(YARD_POOL.Tree),pick(YARD_POOL.Bush),pick(YARD_POOL["Small plant"])];
    scan.i=0;scan.cu={photos:[]};scan.step="closeup";render(true);
  },1800);
}
function addYard(urls){urls.forEach(u=>{scan.photos.push(u);scan.shots.push(newShot("yard","Yard photo "+scan.photos.length))});render()}
function identify(urls){
  const c=scan.cu,p=PLANTS[scan.found[scan.i]];
  urls.forEach(u=>{c.photos.push(u);scan.shots.push(newShot("closeup",`${p.n} close-up ${c.photos.length}`))});
  c.busy=true;render();
  clearTimeout(idTimer);idTimer=setTimeout(()=>{c.busy=false;c.conf=Math.min(99,62+c.photos.length*9+Math.floor(Math.random()*5));render()},1200);
}
function finish(){
  const u=user();
  const pr={id:"p"+Date.now(),name:"",date:Date.now(),photo:scan.photos[0],seed:scan.seed,found:scan.found,shots:scan.shots,quiz:scan.quiz};
  scan=null;openKey=null;
  if(u){pr.name="Yard scan "+(u.projects.filter(p=>!p.example).length+1);u.projects.unshift(pr);save();stack=[{v:"home"},{v:"yard"},{v:"project",id:pr.id}]}
  else{pr.name="Your yard scan";guest=pr;stack=[{v:"home"},{v:"project",id:"guest"}]}
  render(true);
}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

const ACT={
  back,
  theme:el=>{D.theme=isDark()?"light":"dark";document.documentElement.dataset.theme=D.theme;save();el.innerHTML=isDark()?ICON.sun:ICON.moon;el.title=themeLabel();el.setAttribute("aria-label",themeLabel())},
  next:()=>{D.seen=true;save();go("zip")},
  welcomeacct:()=>{D.seen=true;save();acctErr="";go("account")},
  account:()=>{acctErr="";acctDraft={};go("account")},
  signout:()=>{D.me="";save();guest=null;reset(zip?"home":"zip")},
  changezip:()=>{zipErr="";go("zip")},
  go:el=>go(el.dataset.v),
  nav:el=>{const v=el.dataset.v;openKey=null;if(v==="scan"){stack=[{v:"home"}];ACT.newscan();return}stack=v==="home"?[{v:"home"}]:[{v:"home"},{v}];render(true)},
  newscan:()=>{scan={step:"quiz",qi:0,photos:[],shots:[],seed:1+Math.floor(Math.random()*9)};go("scan")},
  sampleyard:()=>addYard([pic(YARD_SAMPLES[scan.photos.length%YARD_SAMPLES.length],960)]),
  analyze:startAnalyze,
  samplecu:()=>{const id=scan.found[scan.i],l=[PLANTS[id].i,...(CU_SAMPLES[id]||[])];identify([pic(l[scan.cu.photos.length%l.length],500)])},
  nextcu:()=>{if(scan.i<scan.found.length-1){scan.i++;scan.cu={photos:[]};render(true)}else finish()},
  project:el=>go("project",{id:el.dataset.id}),
  toggle:el=>{const k=el.dataset.k;openKey=openKey===k?null:k;focusK=k;render()},
  shop:el=>{selShop=el.dataset.id;render()},
  near:el=>{selNear=el.dataset.id;render()},
  nfilter:el=>{nearFilter=el.dataset.f;render()},
  tab:el=>{libTab=el.dataset.t;openKey=null;render()},
  demo:()=>runDemo()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("g[data-act]")){e.preventDefault();ACT[e.target.dataset.act](e.target)}});
document.addEventListener("error",e=>{const t=e.target;if(t.tagName!=="IMG")return;if(t.dataset.h){t.src=leafSVG(+t.dataset.h);delete t.dataset.h}else if(t.dataset.y){t.src=yardSVG(+t.dataset.y);delete t.dataset.y}},true);
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches("[data-upload]")&&t.files.length){
    const urls=[];for(const f of t.files){try{urls.push(await shrink(f))}catch(err){}}
    if(!urls.length)return;
    if(t.dataset.upload==="yard")addYard(urls);else identify(urls);
  }
  if(t.dataset.toggle==="optin"){const u=user();if(u){u.optIn=t.checked;save();render();app.querySelector('[data-toggle="optin"]')?.focus()}}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.dataset.form,el=e.target.elements;
  if(f==="quiz"){saveQuizStep(e.target);if((scan.qi||0)<QSTEPS.length-1)scan.qi=(scan.qi||0)+1;else scan.step="photo";render(true);return}
  if(f==="zip"){
    const v=el.zip.value.trim();
    if(!/^\d{5}$/.test(v)){zipErr="Enter a 5-digit zip code, like 02139.";render();return}
    zipErr="";zip=v;
    const u=user();if(u){u.zip=el.keep.checked?v:"";save()}
    reset("home");
  }
  if(f==="account"){
    const em=el.email.value.trim().toLowerCase(),z=el.zip.value.trim();
    acctDraft={email:em,zip:z};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){acctErr="Enter a valid email address.";render();return}
    if(z&&!/^\d{5}$/.test(z)){acctErr="A zip code is 5 digits. Or leave it blank.";render();return}
    acctErr="";acctDraft={};
    const u=D.users[em]||(D.users[em]={email:em,zip:"",projects:[exampleProject()],optIn:null});
    if(z)u.zip=z;
    D.me=em;D.seen=true;
    if(u.zip)zip=u.zip;
    let dest=[{v:"home"}];
    if(guest){const pr={...guest,id:"p"+Date.now(),name:"Yard scan "+(u.projects.filter(p=>!p.example).length+1)};u.projects.unshift(pr);guest=null;dest=[{v:"home"},{v:"yard"},{v:"project",id:pr.id}]}
    save();openKey=null;
    stack=zip?dest:[{v:"zip"}];render(true);
  }
});

const STOP={};
function dWait(ms){const run=demo;return new Promise((res,rej)=>setTimeout(()=>demo===run&&run?res():rej(STOP),ms))}
const shown=el=>el.getClientRects().length>0;
async function dFind(sel,tries=50){for(let i=0;i<tries;i++){const el=[...document.querySelectorAll(sel)].find(shown);if(el)return el;await dWait(100)}throw STOP}
async function dPoint(el,ms=450){
  let r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>innerHeight-150){el.scrollIntoView({block:"center",behavior:"smooth"});await dWait(450);r=el.getBoundingClientRect()}
  demo.cur.style.transitionDuration=ms+"ms";demo.cur.style.transform=`translate(${r.left+Math.min(r.width/2,60)}px,${r.top+r.height/2}px)`;await dWait(ms+60);
}
function dTap(){const run=demo;if(run.pending){run.pending=false;return Promise.resolve()}run.cur.classList.add("ready");return new Promise((res,rej)=>{run.next=()=>{run.next=null;run.cur.classList.remove("ready");demo===run?res():rej(STOP)};run.cancel=()=>rej(STOP)})}
async function dClick(sel,after=300,ms){
  let el=await dFind(sel);await dPoint(el,ms);await dTap();
  if(!el.isConnected)el=await dFind(sel);
  demo.cur.classList.add("press");await dWait(160);demo.cur.classList.remove("press");
  if(!el.isConnected)el=await dFind(sel);
  el.click();await dWait(after);
}
async function dType(sel,text){const el=await dFind(sel);await dPoint(el);el.value="";for(const ch of text){el.value+=ch;await dWait(110)}}
function dSay(t,pct){demo.cap.textContent=t;demo.prog.style.width=pct+"%"}
async function demoScript(){
  dSay("Tap anywhere to go on",2);await dWait(600);
  await dClick('[data-act="next"]');
  dSay("Set your area",7);await dType("#zip","02139");await dClick('[data-form="zip"] [type=submit]',400);
  dSay("Home",12);await dClick('.tile[data-v="yard"]',400);
  dSay("Start a yard project",16);await dClick('[data-act="newscan"]',400);
  dSay("A few quick questions",20);
  for(const v of ["full","flower","butterfly","songbird","some"]){await dClick(`label:has(input[value="${v}"])`,150,300);await dClick('[data-form="quiz"] [type=submit]',350,300)}
  dSay("Photograph the yard",36);await dClick('[data-act="sampleyard"]',300);await dClick('[data-act="sampleyard"]',300,300);await dClick('[data-act="analyze"]',0);
  dSay("AI looks for plants",42);await dFind('[data-act="samplecu"]');
  for(let i=0;i<3;i++){dSay(`Close-ups: plant ${i+1} of 3`,46+i*6);await dClick('[data-act="samplecu"]',0);await dFind('[data-act="nextcu"]:not([disabled])');await dClick('[data-act="nextcu"]',300)}
  dSay("New plants for your yard",64);await dWait(400);await dClick('.split>div:last-child [data-act="toggle"]',400);
  dSay("Local plant shops",72);await dClick('[data-act="nav"][data-v="shops"]',400);await dClick('.row[data-act="shop"]:nth-child(2)',400);
  dSay("Plant Library",80);await dClick('[data-act="nav"][data-v="plants"]',400);await dClick('[data-act="tab"][data-t="invasive"]',400);await dClick('.list [data-act="toggle"]',400);
  dSay("Pollinator Library",88);await dClick('[data-act="nav"][data-v="pollinators"]',400);await dClick('.list [data-act="toggle"]',400);
  dSay("Yards near me",94);await dClick('[data-act="nav"][data-v="nearby"]',400);await dClick('.row[data-act="near"]:nth-child(2)',400);
  dSay("That's BioCity! 🌱",100);await dClick('[data-act="nav"][data-v="home"]',300);
  dSay("That's BioCity! 🌱 Tap to finish",100);await dTap();
}
async function runDemo(){
  if(demo)return;
  const run={snap:{D:JSON.stringify(D),zip,stack,scan,guest,libTab,selShop,selNear,nearFilter,openKey}};
  const ui=document.createElement("div");
  ui.innerHTML=`<div class="demo-shield"></div><div class="demo-cur"><i></i></div><div class="demo-bar" role="status"><span class="demo-dot"></span><span class="demo-cap">Demo</span><button class="demo-stop" type="button">Stop</button><i class="demo-prog"></i></div>`;
  document.body.append(ui);
  Object.assign(run,{ui,cur:ui.querySelector(".demo-cur"),cap:ui.querySelector(".demo-cap"),prog:ui.querySelector(".demo-prog")});
  run.cur.style.transform=`translate(${innerWidth/2}px,${innerHeight/2}px)`;
  ui.querySelector(".demo-stop").onclick=()=>endDemo(run);
  ui.querySelector(".demo-shield").onclick=()=>run.next?run.next():run.pending=true;
  demo=run;
  D={users:{"demo@biocity.app":{email:"demo@biocity.app",zip:"",projects:[exampleProject()],optIn:true}},me:"demo@biocity.app",seen:false,theme:D.theme};
  zip="";scan=null;guest=null;libTab="native";selShop=null;selNear=null;nearFilter="all";openKey=null;stack=[{v:"welcome"}];render(true);
  try{await demoScript()}catch(e){if(e!==STOP)console.error(e)}
  endDemo(run);
}
function endDemo(run){
  if(!run||demo!==run)return;
  demo=null;run.cancel&&run.cancel();run.ui.remove();clearTimeout(idTimer);
  const s=run.snap;D=JSON.parse(s.D);({zip,stack,scan,guest,libTab,selShop,selNear,nearFilter,openKey}=s);
  render(true);
}
document.addEventListener("keydown",e=>{if(!demo)return;if(e.key==="Escape")endDemo(demo);else if([" ","Enter","ArrowRight"].includes(e.key)){e.preventDefault();demo.next?demo.next():demo.pending=true}},true);
render();
</script>
